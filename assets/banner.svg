<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Code, Create, Race.">
  <defs>
    <pattern id="ground" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="32" height="32" fill="#2a251f"/>
      <rect width="31" height="31" fill="#2e2922"/>
      <circle cx="8" cy="10" r="1" fill="#3b342b"/>
      <circle cx="22" cy="24" r="1.3" fill="#3b342b"/>
    </pattern>
    <pattern id="chevrons" width="24" height="24" patternUnits="userSpaceOnUse" y="150">
      <rect width="24" height="24" fill="#3a3a3a"/>
      <path d="M8 5 l7 7 l-7 7" fill="none" stroke="#5e5e5e" stroke-width="3"/>
    </pattern>
    <pattern id="plates" width="100" height="24" patternUnits="userSpaceOnUse" y="150">
      <rect x="43" y="7" width="14" height="10" rx="2" fill="#e68222" stroke="#8a4a12" stroke-width="1.5"/>
      <rect x="46" y="9" width="6" height="2" fill="#f6b46a"/>
    </pattern>
    <pattern id="sleepers" width="16" height="40" patternUnits="userSpaceOnUse" y="196">
      <rect x="3" y="0" width="8" height="40" fill="#4a3b2b"/>
    </pattern>
    <clipPath id="beltClip"><rect x="0" y="150" width="900" height="24"/></clipPath>
    <g id="plate">
      <rect x="-7" y="-5" width="14" height="10" rx="2" fill="#e68222" stroke="#8a4a12" stroke-width="1.5"/>
    </g>
  </defs>
  <style>
    .belt { animation: belt 0.6s linear infinite; }
    .items { animation: items 2.5s linear infinite; }
    @keyframes belt { from { transform: translateX(0) } to { transform: translateX(24px) } }
    @keyframes items { from { transform: translateX(0) } to { transform: translateX(100px) } }
    .arm { animation: swing 3s ease-in-out infinite; }
    .arm.a { transform-origin: 605px 130px; }
    .arm.b { transform-origin: 745px 130px; animation-delay: -1.5s; }
    .arm.b .held { animation-delay: -1.5s; }
    @keyframes swing {
      0%, 10% { transform: rotate(0deg) }
      45%, 55% { transform: rotate(180deg) }
      90%, 100% { transform: rotate(0deg) }
    }
    .held { animation: held 3s linear infinite; }
    @keyframes held { 0%, 6% { opacity: 0 } 7%, 48% { opacity: 1 } 49%, 100% { opacity: 0 } }
    .gear { animation: spin 4s linear infinite; }
    .gear.a { transform-origin: 605px 70px; }
    .gear.b { transform-origin: 745px 70px; }
    @keyframes spin { to { transform: rotate(360deg) } }
    .train { animation: train 10s linear infinite; }
    @keyframes train {
      0% { transform: translateX(-420px) }
      60%, 100% { transform: translateX(940px) }
    }
  </style>

  <rect width="900" height="260" fill="url(#ground)"/>

  <!-- title panel -->
  <rect x="30" y="22" width="480" height="98" rx="4" fill="#403f40"/>
  <rect x="36" y="28" width="468" height="86" rx="2" fill="#313031" stroke="#1e1e1e"/>
  <text x="54" y="72" font-family="'Titillium Web', 'Segoe UI', Ubuntu, sans-serif" font-size="36" font-weight="700" fill="#ffe6c0">Code, Create, Race.</text>
  <text x="56" y="100" font-family="'Titillium Web', 'Segoe UI', Ubuntu, sans-serif" font-size="15" fill="#c4c4c4">CS Student | Software Engineer | Sim Racing Fan</text>

  <!-- assemblers -->
  <g font-family="'Segoe UI', Ubuntu, sans-serif" font-size="9" font-weight="700" fill="#c4c4c4" text-anchor="middle">
    <rect x="560" y="20" width="90" height="90" rx="4" fill="#5b5b5b" stroke="#222" stroke-width="2"/>
    <rect x="570" y="30" width="70" height="70" rx="2" fill="#454545"/>
    <circle class="gear a" cx="605" cy="70" r="16" fill="none" stroke="#9a9a9a" stroke-width="8" stroke-dasharray="6 4.05"/>
    <circle cx="605" cy="70" r="7" fill="#454545" stroke="#9a9a9a" stroke-width="2"/>
    <text x="605" y="42">KAOW</text>

    <rect x="700" y="20" width="90" height="90" rx="4" fill="#5b5b5b" stroke="#222" stroke-width="2"/>
    <rect x="710" y="30" width="70" height="70" rx="2" fill="#454545"/>
    <circle class="gear b" cx="745" cy="70" r="16" fill="none" stroke="#9a9a9a" stroke-width="8" stroke-dasharray="6 4.05"/>
    <circle cx="745" cy="70" r="7" fill="#454545" stroke="#9a9a9a" stroke-width="2"/>
    <text x="745" y="42">BYAHERO</text>
  </g>

  <!-- belt -->
  <g clip-path="url(#beltClip)">
    <g class="belt"><rect x="-24" y="150" width="948" height="24" fill="url(#chevrons)"/></g>
    <g class="items"><rect x="-100" y="150" width="1000" height="24" fill="url(#plates)"/></g>
  </g>
  <rect x="0" y="147" width="900" height="4" fill="#d9a400"/>
  <rect x="0" y="173" width="900" height="4" fill="#d9a400"/>

  <!-- inserters -->
  <g>
    <rect x="597" y="122" width="16" height="16" rx="2" fill="#4a4a4a" stroke="#222"/>
    <g class="arm a">
      <line x1="605" y1="130" x2="605" y2="160" stroke="#d9a400" stroke-width="4" stroke-linecap="round"/>
      <rect x="599" y="158" width="12" height="5" fill="#8c8c8c"/>
      <use class="held" xlink:href="#plate" x="605" y="166"/>
    </g>
    <circle cx="605" cy="130" r="4" fill="#f0c020" stroke="#222"/>

    <rect x="737" y="122" width="16" height="16" rx="2" fill="#4a4a4a" stroke="#222"/>
    <g class="arm b">
      <line x1="745" y1="130" x2="745" y2="160" stroke="#d9a400" stroke-width="4" stroke-linecap="round"/>
      <rect x="739" y="158" width="12" height="5" fill="#8c8c8c"/>
      <use class="held" xlink:href="#plate" x="745" y="166"/>
    </g>
    <circle cx="745" cy="130" r="4" fill="#f0c020" stroke="#222"/>
  </g>

  <!-- rails -->
  <rect x="0" y="196" width="900" height="40" fill="url(#sleepers)"/>
  <rect x="0" y="202" width="900" height="3" fill="#7a7a7a"/>
  <rect x="0" y="227" width="900" height="3" fill="#7a7a7a"/>

  <!-- train: two cargo wagons + locomotive, heading right -->
  <g class="train">
    <g>
      <rect x="0" y="198" width="110" height="34" rx="3" fill="#5a5148" stroke="#1e1e1e" stroke-width="2"/>
      <path d="M8 204 q20 -10 47 -2 q25 -8 47 2 v8 h-94 z" fill="#b5652a"/>
      <rect x="128" y="198" width="110" height="34" rx="3" fill="#5a5148" stroke="#1e1e1e" stroke-width="2"/>
      <path d="M136 204 q20 -10 47 -2 q25 -8 47 2 v8 h-94 z" fill="#b5652a"/>
      <rect x="110" y="212" width="18" height="6" fill="#2a2a2a"/>
      <rect x="238" y="212" width="18" height="6" fill="#2a2a2a"/>
    </g>
    <g>
      <path d="M256 198 h110 l20 10 v14 l-20 10 h-110 z" fill="#3d3d3d" stroke="#1e1e1e" stroke-width="2"/>
      <rect x="256" y="210" width="128" height="6" fill="#e68222"/>
      <rect x="330" y="201" width="26" height="8" rx="1" fill="#9ec7d6"/>
      <circle cx="380" cy="215" r="3" fill="#fff3c4"/>
    </g>
  </g>
</svg>
