<svg xmlns="http://www.w3.org/2000/svg" width="900" height="41" viewBox="0 0 900 41" role="img" aria-label="Conveyor belt divider"><style>.belt{animation:belt .53s steps(16) infinite}@keyframes belt{to{transform:translateY(-656px)}}.items{animation:items 2.67s linear infinite}@keyframes items{to{transform:translateX(100px)}}</style><image class="belt" href="data:image/png;base64," width="900" height="656"/><image class="items" x="-100" href="data:image/png;base64," width="1000" height="41"/></svg>