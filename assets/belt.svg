<svg xmlns="http://www.w3.org/2000/svg" width="900" height="30" viewBox="0 0 900 30" role="img" aria-label="Conveyor belt divider">
  <defs>
    <pattern id="chevrons" width="24" height="24" patternUnits="userSpaceOnUse" y="3">
      <rect width="24" height="24" fill="#3a3a3a"/>
      <path d="M8 5 l7 7 l-7 7" fill="none" stroke="#5e5e5e" stroke-width="3"/>
    </pattern>
    <pattern id="plates" width="100" height="24" patternUnits="userSpaceOnUse" y="3">
      <rect x="43" y="7" width="14" height="10" rx="2" fill="#e68222" stroke="#8a4a12" stroke-width="1.5"/>
      <rect x="46" y="9" width="6" height="2" fill="#f6b46a"/>
    </pattern>
    <clipPath id="clip"><rect x="0" y="3" width="900" height="24"/></clipPath>
  </defs>
  <style>
    .belt { animation: belt 0.6s linear infinite; }
    .items { animation: items 2.5s linear infinite; }
    @keyframes belt { from { transform: translateX(0) } to { transform: translateX(24px) } }
    @keyframes items { from { transform: translateX(0) } to { transform: translateX(100px) } }
  </style>
  <g clip-path="url(#clip)">
    <g class="belt"><rect x="-24" y="3" width="948" height="24" fill="url(#chevrons)"/></g>
    <g class="items"><rect x="-100" y="3" width="1000" height="24" fill="url(#plates)"/></g>
  </g>
  <rect x="0" y="0" width="900" height="4" fill="#d9a400"/>
  <rect x="0" y="26" width="900" height="4" fill="#d9a400"/>
</svg>
